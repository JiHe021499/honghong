# 独立部署，不依赖 Supabase functions（D10）。只绑定本机端口，由 Caddy 反代。
services:
  ai-gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    # 日志轮转：默认 json-file 没有上限会打满磁盘（日志方案 P0）。单文件 20MB，保留 5 个。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
