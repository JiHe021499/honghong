# 哄哄 应用分发页：/download（正式版）和 /download/beta（测试版）
# 放到 nc_am：/opt/1panel/www/sites/honghong.hczhw.com/proxy/download.conf
# 静态文件放在 /opt/1panel/www/sites/honghong.hczhw.com/download/（容器内为 /www/sites/honghong.hczhw.com/download/）
# 站点已有的 `location / { return 404; }` 不受影响：^~ /download/ 的前缀更长，优先匹配。

location = /download      { return 301 /download/; }
location = /download/beta { return 301 /download/beta/; }

location ^~ /download/ {
    root /www/sites/honghong.hczhw.com;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    charset utf-8;

    # 版本数据：服务器定时任务从 honghong-releases 拉下来的公开 version.json
    location = /download/data/version.json {
        add_header Cache-Control "max-age=60";
        add_header Access-Control-Allow-Origin "*";
    }
    # 图标、样式、脚本
    location ^~ /download/assets/ {
        add_header Cache-Control "max-age=3600";
    }
    # 测试版：不让搜索引擎收录
    location ^~ /download/beta/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache";
    }
}
