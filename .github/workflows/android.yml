name: Android APK

on:
  push:
    branches: [master]
    paths: ['app/**', '.github/workflows/android.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64

      - name: 重命名 APK
        run: cp build/app/outputs/flutter-apk/app-release.apk honghong.apk

      - uses: actions/upload-artifact@v4
        with:
          name: honghong-apk
          path: app/honghong.apk

      - name: 发布滚动预发布 latest-dev
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest-dev
          git push -f origin latest-dev
          if gh release view latest-dev >/dev/null 2>&1; then
            gh release upload latest-dev honghong.apk --clobber
            gh release edit latest-dev --prerelease --notes "开发版，构建自 ${GITHUB_SHA::7}（$(date -u +%Y-%m-%dT%H:%MZ)）"
          else
            gh release create latest-dev honghong.apk --prerelease --title "开发版 latest-dev" \
              --notes "开发版，构建自 ${GITHUB_SHA::7}"
          fi

      - name: 发布正式版
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" honghong.apk --title "$GITHUB_REF_NAME" --generate-notes
