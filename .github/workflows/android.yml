name: Android APK

# 什么时候发版（2026-10-14 起）：
# - push / PR 到 master：只跑 analyze + test 并构建一个【未用发布密钥签名】的 APK 作为构建产物（debug 签名，
#   不能覆盖安装正式版），不碰任何发布密钥，不推送到 honghong-releases。
# - 推送 v* 标签：签名并发布 stable 版（versionName = 标签去掉 v）。
# - 手动 workflow_dispatch（只允许在 master 上）：签名并发布 dev 版（versionName = <pubspec 主.次>.<run_number>-dev）。
# - 标签的主.次必须与 app/pubspec.yaml 一致，否则直接报错、不发布。
# 版本号规则：versionCode = github.run_number（单调递增）。
# 发布时把 APK 和元数据推到公开仓库 honghong-releases 的 upload/<版本> 分支，由那边的工作流创建 Release 并更新 version.json。
# 提交信息里带 [强制更新] 或 [force] 时，这个版本会要求所有旧版本必须更新。

on:
  push:
    branches: [master]
    paths: ['app/**', '.github/workflows/android.yml']
    tags: ['v*']
  pull_request:
    branches: [master]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # 发布（标签 / 手动）不被后来的运行取消，避免发到一半
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' }}

env:
  RELEASES_REPO: JiHe021499/honghong-releases
  # 只有 v* 标签或手动触发才签名发布
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 发布前检查
        if: env.PUBLISH == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::手动发布只允许在 master 上触发（当前 $GITHUB_REF）"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            base=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+)\.([0-9]+).*/\1.\2/')
            case "${GITHUB_REF_NAME#v}" in
              "$base".*) ;;
              *) echo "::error::标签 $GITHUB_REF_NAME 与 pubspec 的主.次版本 $base 不一致，终止发布。请先改 app/pubspec.yaml 的 version，或改用 v$base.x 标签"; exit 1 ;;
            esac
          fi

      - name: 计算版本号
        id: ver
        run: |
          base=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+)\.([0-9]+).*/\1.\2/')
          code=${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"; channel=stable
          elif [ "$PUBLISH" = true ]; then
            name="$base.$code-dev"; channel=dev
          else
            name="$base.$code-ci"; channel=ci
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "版本 $name（$code，$channel）"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

      - name: 写入发布签名
        if: env.PUBLISH == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "::error::缺少 ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KS" | base64 -d > android/app/honghong-release.jks
          printf 'storeFile=app/honghong-release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=honghong\n' "$PW" "$PW" > android/key.properties

      - name: 构建 APK（发布签名）
        if: env.PUBLISH == 'true'
        # 云端地址和 anon key 来自仓库 secret（只放 anon key，绝不放 service_role）；
        # 没配置时为空，App 离线运行，家庭和"参与改进"显示为不可用
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --build-name "${{ steps.ver.outputs.name }}" --build-number "${{ steps.ver.outputs.code }}"
          rm -f android/key.properties android/app/honghong-release.jks
          cp build/app/outputs/flutter-apk/app-release.apk "honghong-${{ steps.ver.outputs.name }}.apk"

      - name: 构建 APK（仅构建检查，debug 签名，不发布）
        if: env.PUBLISH != 'true'
        # 不读取任何 secret：不签名、不编入云端地址（App 离线运行），只验证能编过
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name "${{ steps.ver.outputs.name }}" --build-number "${{ steps.ver.outputs.code }}"
          cp build/app/outputs/flutter-apk/app-release.apk "honghong-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: honghong-${{ steps.ver.outputs.name }}
          path: app/honghong-${{ steps.ver.outputs.name }}.apk

      - name: 生成发布元数据
        if: env.PUBLISH == 'true'
        run: |
          name=${{ steps.ver.outputs.name }}
          apk="honghong-$name.apk"
          prev=$(curl -fsSL "https://raw.githubusercontent.com/$RELEASES_REPO/main/version.json" | jq -r '.commit // empty' 2>/dev/null || true)
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
            log=$(git log --no-merges --format='- %s' "$prev..HEAD" -- . | head -30)
          else
            log=$(git log --no-merges --format='- %s' -10 -- .)
          fi
          [ -n "$log" ] || log="- 例行构建"
          force=false
          if echo "$log" | grep -qiE '\[(强制更新|force)\]'; then force=true; fi
          min=0; $force && min=${{ steps.ver.outputs.code }}
          jq -n --arg name "$name" --argjson code ${{ steps.ver.outputs.code }} --arg channel ${{ steps.ver.outputs.channel }} \
            --arg apk "$apk" --arg sha "$(sha256sum "$apk" | cut -d' ' -f1)" --argjson size "$(stat -c%s "$apk")" \
            --arg log "$log" --argjson force $force --argjson min $min --arg commit "$GITHUB_SHA" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionName:$name, versionCode:$code, channel:$channel, apkName:$apk, sha256:$sha, size:$size,
              changelog:$log, force:$force, minSupportedVersionCode:$min, commit:$commit, publishedAt:$at}' > meta.json
          cat meta.json

      - name: 推送到 honghong-releases
        if: env.PUBLISH == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.RELEASES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$DEPLOY_KEY" > ~/.ssh/id_releases && chmod 600 ~/.ssh/id_releases
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_releases -o IdentitiesOnly=yes"
          name=${{ steps.ver.outputs.name }}
          # 基于公开仓库 main 建上传分支，这样分支里带着那边的发布工作流
          d=$(mktemp -d)
          git clone -q --depth 1 --branch main "git@github.com:$RELEASES_REPO.git" "$d"
          cp meta.json "honghong-$name.apk" "$d/"
          cd "$d"
          git checkout -q -b "upload/v$name"
          git config user.name "honghong-ci" && git config user.email "ci@honghong.invalid"
          git add meta.json "honghong-$name.apk" && git commit -qm "上传 $name"
          git push -f origin "upload/v$name"
          rm -f ~/.ssh/id_releases
