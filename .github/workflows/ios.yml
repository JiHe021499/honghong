name: iOS（未签名）

# 还没有 Apple 开发者账号：只做不签名的编译检查，确认 App 和小组件扩展都能编过，
# 产物是未签名的 Runner.app（含 PlugIns/HonghongWidgets.appex），不能直接装到手机上。
# 不发布（没有 TestFlight/App Store 步骤）：push / PR 到 master 时做构建检查，也可以手动触发。
on:
  push:
    branches: [master]
    paths: ['app/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [master]
    paths: ['app/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: 构建（不签名）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --build-name "0.1.${{ github.run_number }}" --build-number "${{ github.run_number }}"

      - name: 检查小组件扩展已打包
        run: |
          app=build/ios/iphoneos/Runner.app
          test -d "$app/PlugIns/HonghongWidgets.appex" || { echo "::error::缺少 HonghongWidgets.appex"; ls -R "$app" | head -50; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$app/PlugIns/HonghongWidgets.appex/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print NSSupportsLiveActivities' "$app/Info.plist"
          cd build/ios/iphoneos && ditto -c -k --keepParent Runner.app "$GITHUB_WORKSPACE/honghong-ios-unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: honghong-ios-unsigned-${{ github.run_number }}
          path: honghong-ios-unsigned.zip
          retention-days: 14
